{{- if and .Values.global.rttl.features.kgateway.enabled .Values.global.rttl.features.kgateway.httpSectionName -}}
{{- /*
  HTTP->HTTPS redirect. Binds ONLY the :80 listener (via sectionName) and 308s
  this hub's host+path traffic to https. The main/api routes are pinned to the
  :443 listener (httpsSectionName), so :80 carries only this redirect and there is
  no route-attachment tie-break. httpsSectionName is required whenever
  httpSectionName is set (enforced by validateKgatewaySectionNames).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rttl-jupyterhub.hubRouteName" . }}-https-redirect
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - kind: ListenerSet
      name: {{ .Values.global.rttl.features.kgateway.listenerSetName }}
      namespace: {{ .Values.global.rttl.features.kgateway.listenerSetNamespace }}
      sectionName: {{ .Values.global.rttl.features.kgateway.httpSectionName }}
  hostnames:
    - {{ .Values.global.rttl.features.kgateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ trimSuffix "/" .Values.jupyterhub.hub.baseUrl }}/
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
{{- end }}
