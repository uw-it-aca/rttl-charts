global:
  rttl:
    pvstorageclass: "standard-retain"
    features:
      nfs:
        enabled: false
      oidc:
        enabled: false
      kgateway:
        enabled: false
        listenerSetName: ""
        listenerSetNamespace: "default"
        hostname: ""
        # ListenerSet listener section names (defined on the ListenerSet in the
        # flux repo). Set BOTH to turn on a strict HTTP->HTTPS redirect: the hub
        # route (and the api-exempt route) are pinned to the :443 listener, and
        # a redirect route is rendered on the :80 listener that 308s http
        # traffic to https. Leave BOTH empty (default) to attach the hub route
        # to every listener and render no redirect (legacy behavior — unchanged).
        # httpSectionName requires httpsSectionName (enforced at template time).
        httpSectionName: ""     # :80 listener, e.g. "jupyter-eval-http"
        httpsSectionName: ""    # :443 listener, e.g. "jupyter-eval-https"
      # Gateway-terminated UW OIDC (kgateway extAuth / header-trust).
      # Requires kgateway.enabled=true. When enabled, the hub stops doing Canvas
      # OAuth and trusts the X-Auth-Request-User header the gateway injects; the
      # chart renders a per-hub oauth2 TrafficPolicy + an api-exempt HTTPRoute.
      # `enabled` is injected per-deployment by rttl-admin (layer 3), like the
      # other feature flags. See supplemental-gatewayoidc-values.yaml for the
      # authenticator payload.
      gatewayOIDC:
        enabled: false
        # Shared kgateway GatewayExtension that terminates UW OIDC. Per-cluster;
        # the per-hub TrafficPolicy's oauth2.extensionRef points here.
        extensionRef:
          name: "uw-oidc"
          namespace: "rttl-system"

jupyterhub:
  ingress:
    enabled: true
    hosts:
      - rttl.axdd.s.uw.edu
    annotations:
      kubernetes.io/ingress.class: "nginx"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hub:
    baseUrl: ""
    networkPolicy:
      enabled: true
    services:
      rttl_admin_service:
        name: rttl_admin_service
        admin: true
        apiToken: ""
    extraConfig:
      jupyterlab: |
        c.Spawner.cmd = ['jupyter-labhub']
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
    config:
      Authenticator:
        admin_users:
          - replaceme
          - a_rttl_canvas_int
        allowed_users:
          - replaceme
          - a_rttl_canvas_int
      GenericOAuthenticator:
        client_id: ""
        client_secret: ""
        oauth_callback_url: ""
        authorize_url: https://canvas.uw.edu/login/oauth2/auth
        token_url: https://canvas.uw.edu/login/oauth2/token
        userdata_url: https://canvas.uw.edu/api/v1/users/self/profile
        scope:
          - url:GET|/api/v1/users/:user_id/profile
        username_key: login_id
      JupyterHub:
        authenticator_class: generic-oauth
  proxy:
    secretToken:
    chp:
      networkPolicy:
        enabled: true
    service:
      type: ClusterIP
  prePuller:
    continuous:
      enabled: false
    hook:
      enabled: false
    extraImages: {}
  scheduling:
    userPlaceholder:
      enabled: false
      replicas: 0
    userPods:
      nodeAffinity:
        matchNodePurpose: require
      tolerations:
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: streamuser
          effect: NoSchedule
        - key: hub.jupyter.org_dedicated
          operator: Equal
          value: streamuser
          effect: NoSchedule
    userScheduler:
      enabled: true
    podPriority:
      enabled: true
  cull:
    enabled: true
    timeout: 1200
    every: 300
  singleuser:
    image:
      name: us-west1-docker.pkg.dev/uwit-mci-axdd/rttl-images/jupyter-scipy-notebook
      tag: "2.9"
      pullPolicy: IfNotPresent
    storage:
      capacity: 5G
      dynamic:
        storageClass: standard-retain
    cpu:
      guarantee: 0.5
      limit: 2
    memory:
      guarantee: "1G"
      limit: "2G"
    networkPolicy:
      enabled: true
    startTimeout: 600
    defaultUrl: "/lab"
    lifecycleHooks:
      postStart:
        exec:
          command:
            - "/bin/sh"
            - "-c"
            - >
              mkdir -p /home/jovyan/.ipython/profile_default;
              echo 'c.InteractiveShell.cache_size = 0' > /home/jovyan/.ipython/profile_default/ipython_kernel_config.py;
  debug:
    enabled: false
